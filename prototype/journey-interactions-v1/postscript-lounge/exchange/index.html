<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const { pathname, search, hash } = window.location;
        const lastSegment = pathname.split("/").pop();
        if (lastSegment && !lastSegment.includes(".")) {
          window.location.replace(`${pathname}/${search}${hash}`);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11120e" />
    <meta name="description" content="留下一句后话，再带走陌生人的一句。" />
    <title>交换后话｜PostScript 后话客厅</title>
    <link rel="icon" href="../wine/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css?v=20260928-3" />
  </head>
  <body>
    <a class="skip-link" href="#exchange-app">跳到交换后话</a>
    <div class="module-shell">
      <header class="module-topbar">
        <a class="module-back" href="../" data-context-link><span aria-hidden="true">←</span> 数字客厅</a>
        <div class="exchange-topbar-actions">
          <span class="module-status" data-exchange-mode>OTHERS · 一句话</span>
          <button class="exchange-inbox-entry" type="button" data-inbox-entry hidden>
            我的后话
            <span class="exchange-inbox-badge" data-inbox-badge hidden aria-hidden="true">0</span>
          </button>
        </div>
      </header>
      <main id="exchange-app" class="module-main"></main>
    </div>
    <noscript>请开启 JavaScript 后使用交换后话。</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
