<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const { pathname, search, hash } = window.location;
        const lastSegment = pathname.split("/").pop();
        if (lastSegment && !lastSegment.includes(".")) {
          window.location.replace(`${pathname}/${search}${hash}`);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11120e" />
    <meta name="description" content="3–6 人抽一张后话卡，轮流说、互相猜、一起答，聊点平时不会聊的。" />
    <title>抽后话卡｜PostScript 后话客厅</title>
    <link rel="icon" href="../wine/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css?v=20260928-3" />
  </head>
  <body>
    <a class="skip-link" href="#cards-app">跳到抽卡内容</a>
    <div class="module-shell">
      <header class="module-topbar">
        <a class="module-back" href="../" data-context-link><span aria-hidden="true">←</span> 数字客厅</a>
        <span class="module-status">US · 一个问题</span>
      </header>
      <main id="cards-app" class="module-main"></main>
    </div>
    <noscript>请开启 JavaScript 后使用后话卡。</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
